# Běžné ceny zpátečních letenek z PRG / BRQ / OSR / PED / VIE / BTS.
#
# typical_czk = běžná cena v běžném období
# great_czk   = cena, o které se píše jako o výborné nabídce
#
# Zdroje a konkrétní zjištěné ceny jsou v komentářích u jednotlivých regionů.
# U každého čísla je značka [zjištěno] (stojí na konkrétní ceně ze zdroje)
# nebo [odhad] (dopočet nebo úsudek).
#
# ---------------------------------------------------------------------------
# ODKUD ČÍSLA POCHÁZEJÍ
#
# 1) cestujlevne.com — RSS na /feed a výpis na /akcni-letenky (144 nabídek
#    proskenováno 27. 7. 2026). U každé nabídky je cena v Kč A procento slevy.
#    Z toho jde dopočítat, jakou běžnou cenu redakce sama uvažuje:
#        typical = cena / (1 - procento/100)
#    Tyhle dopočty jsou v komentářích značené jako „implikuje“. Vycházejí
#    pozoruhodně kulatě (1500 / 2000 / 2500 / 3000 / 4000 / 17000 …), takže
#    redakce zjevně pracuje s pevným ceníkem — přesně s tím, co stavíme tady.
#
# 2) Redakční text cestujlevne.com. Nejcennější druh údaje, protože běžnou
#    cenu píše přímo. Doslovný nález z 27. 7. 2026 (Neapol z Prahy):
#    „běžné ceny do libovolné destinace se na tyto dny pohybují spíš v rámci
#    3 až 4 tisíc korun“ (víkendové lety z Prahy po Evropě).
#
# 3) travelfree.info a fly4free.com — RSS feedy (hlavní + tagy prague, vienna,
#    budapest, australia, dubai, iceland + sekce africa, north-america).
#    Ceny v EUR, přepočet kurzem 25 Kč/EUR.
#
# ---------------------------------------------------------------------------
# JAK ČÍST `match`
#
# Výrazy se hledají jako PODŘETĚZEC v názvu nabídky, malými písmeny.
# Z toho plynou tři pasti, kterých se seznamy drží:
#
# a) Krátké výrazy jsou uvnitř delších slov. Vynecháno nebo prodlouženo:
#    „oman“ (uvnitř „romania“), „iran“ (uvnitř „tIRANa“), „peru“ (uvnitř
#    „perugia“), „mali“ (uvnitř „soMALIa“), „porto“ (uvnitř „portoriko“),
#    „faro“ (uvnitř „faroe“), „kos“ (uvnitř „kosovo“, „košice“), „nice“
#    (uvnitř anglického „nice“), „split“, „male“, „usa“, „goa“.
#
# b) NÁZVY AEROLINEK obsahují názvy zemí. Tohle je nejzrádnější past a v datech
#    je jí plno — reálné titulky ze zdrojů:
#      „Air France flights ... to Tunisia“        -> „france“ by ukázalo na Francii
#      „Namibie z Vídně s Ethiopian Airlines“     -> „ethiopia“ na Etiopii
#      „Na Filipíny z Vídně s Air India“          -> „india“ na Indii
#      „Brussels & Austrian Airlines ... Nairobi“ -> „brussels“, „austria“ na Evropu
#      „Turkish Airlines ... to Bangkok“          -> „turkish“ na Turecko
#      „Phuket z Prahy i Vídně s Air Arabia“      -> „arabia“ na Saúdskou Arábii
#    Proto tu NENÍ: france, austria, brussels, india, china, canada, japan,
#    korean, vietnam, malaysia, kenya, egypt, cairo, croatia, cyprus, iceland,
#    portugal, mexico, serbia, ethiopia, rwanda, nepal, sri lanka, singapore,
#    qatar, emirates, arabia, georgia, mauritius, seychelles, tanzania, baltic,
#    scandinavia, moldova, uzbekistan, zimbabwe, senegal, madagascar, tunis.
#    Místo nich jsou města nebo tvary s předložkou („to china“, „china from“),
#    které se do názvu aerolinky netrefí.
#
# c) Odletová města tu nejsou: prague, praha, vienna, vídeň, wien, bratislava,
#    brno, ostrava, pardubice, budapest, warsaw, varšava.
#
# ZNÁMÉ OMEZENÍ: fly4free a travelfree píšou i evropská města jako VÝCHOZÍ bod
# („Full service flights from Milan to PHUKET, Thailand from €460“). Takový
# titulek se trefí do evropy i do jihovýchodní Asie zároveň. Evropská města
# ze seznamů vyhodit nejde — z Prahy jsou to legitimní cíle. Při shodě ve dvou
# regionech proto ber ten VZDÁLENĚJŠÍ (dražší typical_czk); u těchhle zdrojů
# je cíl skoro vždy ta exotičtější půlka.

