# Doručuje obchod do ČR?
#
# Pepper feedy jsou německé, britské, francouzské a polské. Fyzické zboží má smysl
# jen když e-shop pošle do ČR. Klíč se hledá jako podřetězec v názvu obchodu
# (lowercase), takže "amazon" pokryje i "Amazon.de" a "Amazon Marketplace".
#
# Co tu není, je "neznámo" -> položka nikdy nejde jako INSTANT, spadne do souhrnu
# s poznámkou. AI soudce pak může odhad doplnit.

# Digitální zboží — doprava je nesmysl, vždycky projde.
