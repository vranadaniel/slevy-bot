# --- Antivirus a VPN ---
# Prodávají se na roky, takže měsíční sazba × `parse_months` škáluje správně
# i u tříleté licence. Ceny jsou za jedno zařízení; balíky na deset zařízení
# tím pádem spíš podstřelíme, což je správný směr chyby.
- match: ["eset", "premium"]
  value_czk_per_month: 110
- match: ["eset"]
  value_czk_per_month: 100
- match: ["avast", "secureline"]
