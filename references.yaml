# Ruční ceník reálných hodnot.
#
# Překlenuje studený start (než se nasbírá vlastní cenová historie) a řeší položky,
# kde žádná cenová databáze neexistuje — hlavně předplatné.
#
# Pravidlo se použije, když jsou VŠECHNY výrazy z `match` obsaženy v názvu položky
# (case-insensitive). Řadí se od nejkonkrétnějšího; vyhrává první shoda.
#
# value_czk_per_month  -> hodnota se násobí počtem měsíců vyčteným z názvu
# value_czk            -> jednorázová hodnota
#
# Tenhle soubor si klidně rozšiřuj. Čím víc pravidel, tím míň práce pro AI soudce.
#
# POZOR na to, co sem NEPATŘÍ. Ocenění odsud má `confidence` 1,0 a v `_finalize`
# obchází práh důvěryhodnosti — jde tedy rovnou na mobil. Jedno rozvolněné
# pravidlo proto neznamená jednu chybu, ale desítky zpráv denně. Dvě skupiny
# položek se sem schválně nedostaly, obojí ověřeno na živém katalogu:
#
# * **Herní měna a předplacené karty** (Robux, krystaly, FC Points, Steam Wallet,
#   Minecoins, Telegram Stars). Jejich cena je nominální hodnota, takže by šly
#   ocenit přesně — jenže levné jsou hlavně proto, že jsou REGIONÁLNÍ, a turecký
#   kód na český účet nemusí projít. Je to tatáž past, kvůli které ITAD nikdy
#   nespouští okamžité upozornění.
# * **Objemové licence Office 2016/2019.** Nominálních 12 000 Kč proti klíči za
#   dvě stovky dává poměr 1,5 % u položky, které je katalog plný. Legitimní
#   trhák to není, jen jiná distribuční cesta.
#
# Ceny jsou české ceníkové k 28. 7. 2026 a jsou to odhady řádu, ne přesná čísla.
# Ladit se dají kdykoliv; `--explain UID` ukáže, které pravidlo se chytlo.

